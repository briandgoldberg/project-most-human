# Pays the prizes that are owed, once a day.
#
# The treasury's key lives here, as a repository secret, and nowhere near the
# website. It is the only thing to set, under Settings > Secrets and variables > Actions:
#
#   Secret     TREASURY_SECRET_KEY   the treasury wallet's private key (base58, or a JSON array)
#
# Everything else the job learns from the website: what is owed, which coin,
# which treasury. It gets that by proving who it is, with the token GitHub
# signs for each run of this workflow on the main branch; it holds no copy of
# the website's own secrets. (Optional variables: PAYOUT_SITE, PAYOUT_CAP_TOKENS.
# Optional secret: SOLANA_RPC_URL, to use a different connection to the chain
# from the website's.)
#
# The website tells players when this runs. Keep PAYOUT_HOUR_UTC there equal to
# the hour in the schedule below.
name: Daily payouts

on:
  schedule:
    # 17:05 UTC every day. GitHub starts scheduled runs late when it is busy, so "around", not "at".
    - cron: "5 17 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Send the payments. Unticked, it only lists what is owed."
        type: boolean
        default: false

# Never two runs at once: the second would pay what the first is still paying.
concurrency:
  group: payouts
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the run ask GitHub for a signed token saying which workflow it is. That token is what the website trusts.
  id-token: write

jobs:
  pay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYOUT_SITE: ${{ vars.PAYOUT_SITE || 'https://project-most-human.vercel.app' }}
      # The most one run may send. Over that it sends nothing and fails, for a person to look.
      PAYOUT_CAP_TOKENS: ${{ vars.PAYOUT_CAP_TOKENS || '5000' }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TREASURY_SECRET_KEY: ${{ secrets.TREASURY_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: List what is owed
        if: github.event_name == 'workflow_dispatch' && !inputs.execute
        run: npm run prizes
      - name: Check the treasury key is in place
        if: github.event_name == 'schedule' || inputs.execute
        run: |
          if [ -z "$TREASURY_SECRET_KEY" ]; then
            echo "::error::TREASURY_SECRET_KEY is not set. Add it under Settings > Secrets and variables > Actions. Nothing was sent."
            exit 1
          fi
      - name: Pay what is owed
        if: github.event_name == 'schedule' || inputs.execute
        run: npm run prizes -- --execute
